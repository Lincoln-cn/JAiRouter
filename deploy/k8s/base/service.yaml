apiVersion: v1
kind: Service
metadata:
  name: jairouter
  labels:
    app.kubernetes.io/name: jairouter
    app.kubernetes.io/component: gateway
spec:
  # ClusterIP：集群内访问。对外暴露请经 Ingress（见 ingress.yaml）。
  #
  # 客户端 IP 注意：ClusterIP + kube-proxy 下，Pod 内看到的 remoteAddress 不保证是
  # 真实客户端 IP（可能是客户端 Pod IP、节点 IP 或网关 IP）。这直接影响
  # 「按 IP 维度限流」与安全审计的语义——部署前请阅读
  # docs/zh/deployment/multi-replica.md 的「限流键维度」一节，
  # 必要时把 key-dimension 改为 api-key 或 tenant。
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jairouter
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
