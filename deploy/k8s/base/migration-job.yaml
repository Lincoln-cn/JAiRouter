apiVersion: batch/v1
kind: Job
metadata:
  name: jairouter-schema-init
  labels:
    app.kubernetes.io/name: jairouter
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 2
  # 完成后自动清理，避免每次部署累积已完成的 Job。
  ttlSecondsAfterFinished: 600
  # 兜底：进程若不自行退出则强制终止，避免部署流程被挂住。
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jairouter
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: jairouter
      securityContext:
        runAsNonRoot: true
        runAsUser: 10010
        runAsGroup: 10010
        fsGroup: 10010
      containers:
        - name: schema-init
          image: sodlinken/jairouter:latest
          imagePullPolicy: IfNotPresent
          # 以「非 Web」方式启动一次，让启动期的兼容迁移（建表 / 补列，见
          # CompatibilitySchemaMigrator）由**单一实例**先跑完，避免多副本同时启动时的
          # 并发 DDL。
          #
          # 两个参数都是必需的：
          # - web-application-type=none：不起 Web 层。注意 SecurityConfiguration 必须带
          #   @ConditionalOnWebApplication(REACTIVE)，否则该模式会因缺 ServerHttpSecurity
          #   而启动失败、迁移从不执行（issue #195，已修）。
          # - migration.exit-after-run=true：迁移跑完后进程**不自退**（调度器等非守护线程
          #   会留住 JVM，实测 150 秒仍在运行），需要这个开关主动退出，Job 才能以成功结束
          #   （issue #195）。上面的 activeDeadlineSeconds 仅作兜底。
          #
          # 彻底方案是引入版本化迁移工具（Flyway / Liquibase）并提供独立迁移入口，
          # 属后续项，已在 docs 的「已知未覆盖」中记录。
          args:
            - "--spring.main.web-application-type=none"
            - "--spring.main.banner-mode=off"
            - "--jairouter.migration.exit-after-run=true"
          envFrom:
            - configMapRef:
                name: jairouter-config
            - secretRef:
                name: jairouter-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: jairouter-config-files
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
