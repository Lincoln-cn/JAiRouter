apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 生产 overlay：3 副本。
#
# 多副本的前置条件（务必先满足，否则各副本会退化为互不知情的单机实例）：
#   1. 共享数据库已落地（base 的 ConfigMap 已开启共享态开关，但连接信息需由
#      Secret / 环境变量提供）；
#   2. 已阅读 docs/zh/deployment/multi-replica.md。
#
# 本 overlay 不修改镜像 tag——生产请用 kustomize edit set image 或在此显式覆盖，
# 不要沿用 latest。

namespace: jairouter

resources:
  - ../../base

replicas:
  - name: jairouter
    count: 3

patches:
  # 3 副本时保证至少 2 个在线（滚动升级/节点驱逐期间容量不塌陷）
  - target:
      kind: PodDisruptionBudget
      name: jairouter
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 2
  # 显式声明副本数：让多副本共享态自检不依赖 POD_NAME 环境探测，
  # 也使 replicas 与 PDB 的取值在同一处可见。
  - target:
      kind: Deployment
      name: jairouter
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: JAIROUTER_REPLICAS
          value: "3"
