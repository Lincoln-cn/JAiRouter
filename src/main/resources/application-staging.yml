# ========================================
# 预发布环境配置（v2.8.x 精简版）
# ========================================
# 此文件仅包含预发布环境特定的差异化配置
# 基础配置通过模块化导入，详见 application.yml

# 日志配置（预发布环境标准日志）
logging:
  level:
    root: INFO
    org.unreal.modelrouter: INFO
    org.springframework: WARN
  file:
    name: logs/jairouter-staging.log

# 管理端点（预发布环境部分开放）
management:
  endpoint:
    health:
      show-details: when-authorized

# 安全配置（预发布环境）
jairouter:
  security:
    enabled: true

    jwt:
      enabled: true
      # 只认 JWT_SECRET（#674）：STAGING_JWT_SECRET 兼容别名已移除。
      # 缺变量时绑定为空串（长度校验在运行期做，见 #821），进程仍能起来；
      # staging 不在启动门闩判定范围内，JWT 签发/校验会在使用时报 WeakKeyException。
      secret: "${JWT_SECRET:}"
      issuer: "jairouter-staging"

      persistence:
        enabled: true
        redis:
          enabled: true

    api-key:
      enabled: true

    audit:
      log-level: "INFO"
      retention-days: 30

    sanitization:
      response:
        enabled: true
