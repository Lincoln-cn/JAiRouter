# ========================================
# 开发环境配置（v2.8.x 精简版）
# ========================================
# 此文件仅包含开发环境特定的差异化配置
# 基础配置通过模块化导入，详见 application.yml

# 服务器配置（开发环境）
server:
  port: 8080

# Swagger API 文档配置（仅开发环境）
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
  # ⚠️ 必须是**真实存在且包含控制器**的父包（issue #457）。
  # 原值是 `org.unreal.modelrouter.controller` —— 这个包在整个代码库里**不存在**
  # （控制器都在 router/monitor/auth/config/persistence 各自的 `controller` 子包下），
  # 于是 springdoc 扫了个空包，`/v3/api-docs` 返回 `{"paths":{},"components":{}}`（实测 180 字节、0 个路径），
  # Swagger UI 打开后没有任何接口。改成命名空间根包后实测 312 个路径 / 34 个 tag / 270 个 schema。
  packages-to-scan: org.unreal.modelrouter
  show-actuator: true
  cache:
    disabled: true

# H2 控制台（仅开发环境）
spring:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

# 日志配置（开发环境详细日志）
logging:
  level:
    org.unreal.modelrouter: DEBUG
    org.springframework: INFO

# 管理端点（开发环境全部开放）
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      show-components: always
    jwt-tokens:
      enabled: true
    jwt-blacklist:
      enabled: true
    jwt-persistence-health:
      enabled: true

# 安全配置（开发环境启用测试功能）
jairouter:
  security:
    enabled: true
    
    jwt:
      enabled: true
      secret: "${JWT_SECRET:${DEV_JWT_SECRET:dev-secret-key-for-testing-only-32-characters-minimum}}"

      accounts:
        - username: "admin"
          password: "{noop}${INITIAL_ADMIN_PASSWORD:ChangeMeOnFirstStartup123456}"
          roles: ["ADMIN", "USER"]
          enabled: true
        - username: "user"
          password: "{noop}${DEV_USER_PASSWORD:user123}"
          roles: ["USER"]
          enabled: true
    
    api-key:
      enabled: true

      # 内置测试密钥：仅 dev profile 提供（#663）。
      # 基础配置 config/auth/api-key.yml 的 keys 为 []，因此这条路是「本地一键可用」的唯一来源；
      # 生产/预发不继承它，密钥必须经控制台或 API 创建。
      keys:
        - key-id: "test-key-001"
          key-value: "sk-test-api-key-12345678"
          description: "本地开发用 API Key"
          permissions: "read,write"
          enabled: true
      
    audit:
      log-level: "DEBUG"
      include-request-body: true
      include-response-body: true
    
    sanitization:
      response:
        enabled: false

# WebClient 配置（开发环境宽松超时）
webclient:
  connection-timeout: 5s
  read-timeout: 15s
  write-timeout: 15s

# 调试模式
debug: false