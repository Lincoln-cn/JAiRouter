# ========================================
# 安全审计配置 (auth 模块)
# ========================================
# 此文件包含安全审计日志配置
# 位置：org.unreal.modelrouter.auth.audit

jairouter:
  security:
    audit:
      # 审计功能开关
      enabled: true
      
      # 日志级别
      log-level: "INFO"
      
      # 是否记录请求体（生产环境建议关闭）
      include-request-body: false
      
      # 是否记录响应体（生产环境建议关闭）
      include-response-body: false
      
      # 日志保留天数
      retention-days: 90
      
      # 扩展审计配置
      extended:
        enabled: true
