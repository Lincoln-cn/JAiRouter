# ========================================
# API Key 认证配置 (auth 模块)
# ========================================
# 此文件包含 API Key 认证相关配置
# 位置：org.unreal.modelrouter.auth.security

jairouter:
  security:
    api-key:
      # API Key 功能开关
      enabled: true

      # API Key 头名称
      header-name: "X-API-Key"

      # 默认过期天数
      default-expiration-days: 365

      # 缓存配置
      cache-enabled: true
      cache-expiration-seconds: 3600

      # 本副本 API Key 缓存的刷新（#162）。
      #
      # 缓存是各副本自己的内存镜像，只在本进程内更新：多副本下在 A 副本吊销或新建的 Key，
      # B 副本原先要等到重启才能感知——已吊销的 Key 会继续被放行。开启后各副本在当前间隔内
      # 收敛到共享存储的最新内容（含移除已删除项）。
      #
      # 该任务刷新的是「本副本」的缓存，每个副本都必须执行，因此刻意不加跨副本排他锁。
      # 置 cache-refresh-enabled: false 可回退到「仅启动时装载」的旧行为。
      cache-refresh-enabled: true
      cache-refresh-interval-seconds: 60

      # API Key 列表（仅用于开发环境测试）
      # 生产环境应通过 API 管理或环境变量配置
      keys:
        - key-id: "test-key-001"
          key-value: "sk-test-api-key-12345678"
          description: "测试用 API Key"
          permissions: "read,write"
          enabled: true

    # API Key 配额管理配置
    quota:
      # 启用配额清理调度器（每天凌晨 3:00 清理 >30 天的历史数据）
      cleanup:
        enabled: true