# ========================================
# JWT 认证配置 (auth 模块)
# ========================================
# 此文件包含 JWT 认证相关配置
# 位置：org.unreal.modelrouter.auth.security

jairouter:
  security:
    # 安全功能开关
    enabled: true

    jwt:
      # JWT 功能开关
      enabled: true
      
      # JWT 令牌头名称
      jwt-header: "Jairouter_Token"
      
      # JWT 密钥（生产必须设置环境变量 JWT_SECRET，长度 >= 32 字符）
      # R2-P0-01：不再提供“公开可用的默认密钥”（#664）——缺 JWT_SECRET 时用 ${random.uuid}
      # 随机生成（每次启动不同，重启后旧令牌全部失效）；prod 由 StartupSecretKeyChecker /
      # StartupSecurityGate 在缺 JWT_SECRET 时直接拒绝启动。
      # dev profile 另有开发用字面量兜底（见 application-dev.yml）；所有 profile 都只读 JWT_SECRET（#674）。
      secret: "${JWT_SECRET:${random.uuid}}"
      
      # JWT 算法
      algorithm: "HS256"
      
      # 令牌过期时间（分钟）
      expiration-minutes: 60
      
      # 刷新令牌过期时间（天）
      refresh-expiration-days: 7
      
      # JWT 发行者
      issuer: "jairouter"
      
      # 黑名单功能
      blacklist-enabled: true
      
      # 用户账户配置
      accounts:
        - username: "admin"
          # 密码必须使用环境变量（首次启动时设置）
          # R2-P0-02：生产必须设置 INITIAL_ADMIN_PASSWORD，否则启动门闩直接拒绝启动。
          # #664：非生产环境不再回落到公开口令，缺省时随机生成，并在启动日志中打印一次
          # （见 StartupSecretKeyChecker#reportGeneratedAdminPassword）。
          password: "{noop}${INITIAL_ADMIN_PASSWORD:${random.uuid}}"
          roles: ["ADMIN", "USER"]
          enabled: true
        # R2-P0-02：移除硬编码 user 账户口令；如需本地账号请通过管理 API 创建
        # - username: "user"
        #   password: "{noop}${INITIAL_USER_PASSWORD:user123456}"
        #   roles: ["USER"]
        #   enabled: false

      # JWT 持久化配置
      persistence:
        enabled: true
        composite:
          enabled: false
        sync:
          enabled: false
        startup-recovery:
          enabled: true
        cleanup:
          schedule: "0 */5 * * * ?"
          retention-days: 7
        redis:
          # 只保留开关：连接信息统一由 REDIS_HOST/REDIS_PORT/REDIS_PASSWORD 或 spring.data.redis.* 提供。
          # 原先这里的 host/port/password/database 自 issue #196（取消 JWT 独立 Redis）起已无消费者，
          # 留着会让人以为改它有效（见 #202）。
          enabled: false

      # JWT 黑名单持久化配置
      blacklist:
        persistence:
          enabled: true
        composite:
          enabled: false
        redis:
          # 同上：只保留开关
          enabled: false