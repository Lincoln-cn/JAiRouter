# ========================================
# 服务器配置 (common 模块)
# ========================================
# 此文件包含服务器基础配置
# 位置：org.unreal.modelrouter.common

server:
  port: 8080
  # 优雅停机：停止接收新连接，等待在途请求（含 SSE 流式响应）完成后再关闭。
  # 默认 immediate 会在重启/滚动升级时直接切断在途 AI 流式响应。
  # Netty/Reactor 下 graceful 会等待在途请求；超过 timeout-per-shutdown-phase 后强制关闭剩余连接。
  shutdown: graceful

# Spring Boot 基础配置
spring:
  main:
    allow-circular-references: false

  # 停机阶段最大等待时间。
  # 30s 理由：覆盖绝大多数 AI 流式响应的完成时间（通常数秒~数十秒），
  # 同时不会让滚动重启/Docker stop 长时间阻塞。可按环境用
  # spring.lifecycle.timeout-per-shutdown-phase 覆盖。
  lifecycle:
    timeout-per-shutdown-phase: 30s

  # WebFlux 配置
  webflux:
    multipart:
      max-in-memory-size: 10MB
      max-disk-usage-per-part: 100MB
      max-parts: 50
      max-headers-size: 8KB
      file-storage-directory: "${java.io.tmpdir}"

  # Reactor Netty 配置
  reactor:
    netty:
      max-initial-line-length: 4096
      max-header-size: 8192
      max-chunk-size: 8192

  # Profile 配置
  # 不要在这里写 spring.profiles.active：本文件会被打进发布包，写 dev 等于让所有未显式指定
  # profile 的启动（含 java -jar、IDE 直接运行）都按 dev 跑，从而连带启用内置测试 API Key、
  # 文档里的固定管理员口令与 DEBUG 日志 —— 这是 #666 记录的问题。
  # 本地开发请显式指定：--spring.profiles.active=dev 或 -Dspring-boot.run.profiles=dev；
  # 不指定时按 Spring Boot 默认（default profile）启动：无内置测试凭据，JWT 密钥与管理员
  # 口令随机生成并打印在启动日志里（见 #664）。