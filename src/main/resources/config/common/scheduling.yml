# ========================================
# 定时任务配置 (common 模块)
# ========================================
# 位置：org.unreal.modelrouter.common.scheduling

jairouter:
  scheduling:
    # 定时任务的跨副本排他锁。
    #
    # 多副本部署下，@Scheduled 任务会在每个副本各执行一遍。对「副作用可被外部观测」的任务
    # （发告警、出日报、落归档文件、轮换密钥），重复执行会产生重复告警与重复产物；
    # 打开本项后，同名任务在同一周期内只由一个副本执行（Redis setIfAbsent 实现）。
    #
    # - 未配置 Redis 时自动降级为单实例语义（放行），行为与引入本项前一致
    # - Redis 不可用或取锁异常时 fail-open 放行并告警（宁可重复执行，也不让清理与巡检停摆）
    # - 置 false 可完全回退到「每个副本各跑一遍」的旧行为
    #
    # 幂等任务（删除过期数据等）未加锁：重复执行无害，加锁反而平白引入 Redis 依赖。
    distributed-lock:
      enabled: true
