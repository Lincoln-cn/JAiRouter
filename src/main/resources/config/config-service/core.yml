# ========================================
# 配置服务核心配置 (config 模块)
# ========================================
# 此文件包含 ConfigurationService 核心配置
# 位置：org.unreal.modelrouter.config.core

store:
  # 存储类型（v1.5.1+ 使用 JPA）
  type: jpa
  
  # 配置文件路径（用于导入导出）
  path: ./config
  

# 数据源配置（支持环境变量覆盖，默认 H2）
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/jairouter;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_UPPER=FALSE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    
    # 连接池（#945）。显式写出 HikariCP 的默认值，让它出现在配置面上、可被放宽，
    # 而不是一个看不见的隐式默认。
    # 实测（2026-11-01，H2 + mock 上游）：把池从 10 调到 32 不提升吞吐（384.7 → 368.6 RPS），
    # p99 反而变差；排队的根因是单请求的固定开销（每请求 3 次写库），不是连接数。
    # 方法见 docs/zh/troubleshooting/performance.md；覆盖请用 Spring 标准环境变量
    # SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE 等，不必改这里。
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      max-lifetime: 1800000
  
  # JPA 配置
  jpa:
    hibernate:
      # 这里的 update 只是**兜底**：两种受支持的方言都会由 FlywayDialectEnvironmentPostProcessor
      # 按 spring.datasource.url 覆盖 —— PostgreSQL 覆盖为 validate（建表由 db/migration/postgres
      # 负责，issue #191 / #192），H2 覆盖为 none（建表由 db/migration/h2 负责，issue #1037）。
      # 覆盖按方言判定，所以不能写成 profile。
      #
      # 这一行仍必须保留：缺了它，Hibernate 对嵌入式数据源的默认值会退化为 create-drop，
      # 开发库会在停机时被清空。认不出的方言（不在两套迁移脚本覆盖范围内）反过来依赖这行的
      # update 建表，故不能直接删成 none。
      # 测试环境（application-test.yml）显式设了 create-drop 与 flyway.enabled=false，
      # 处理器据此跳过覆盖，H2 内存库仍由 Hibernate 建表。
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  
  # H2 控制台配置（默认关闭）
  h2:
    console:
      enabled: false