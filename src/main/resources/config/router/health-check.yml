# ========================================
# 健康检查配置 (router 模块)
# ========================================
# 由 router/checker/ServerChecker 每轮读取；v3.5.4 起可配（#650 #651）。
# 位置：org.unreal.modelrouter.router.checker.HealthCheckProperties
#
# 说明：检查只影响「实例是否可被选中」，不会主动摘除实例；
# 实例被判定不健康后，请求会跳过它，恢复后自动回到候选集。

jairouter:
  health-check:
    # 探活方式：http = 真正请求一次并校验状态码（#833 起为默认）；tcp = 只探端口连通
    # 为什么默认 http：TCP 只知道端口能连上，上游进程僵死时仍会被判健康
    mode: http
    # 两轮检查之间的固定延迟（毫秒）；上一轮没跑完时本轮触发会被跳过，不会叠加
    interval-ms: 30000
    # 单个实例的探活超时（毫秒）
    timeout-ms: 5000
    # 同时检查几个服务类型（1-16）
    parallelism: 4
    # 连续失败多少轮才把实例判为不健康（1-10，默认 2；#855）
    # 默认 2 是为了吸收单轮抖动：一个服务的全部实例一旦被判不健康，该类型的所有请求会立刻 503，
    # 直到下一轮（默认 30 秒后）检查把实例判回来。设为 1 可恢复「单轮失败即摘除」的旧行为。
    failure-threshold: 2
    # mode=http 时的探活路径，默认 /v1/models（OpenAI 兼容上游的通用端点）
    # 判定口径：状态码 < 500 视为健康（含 404/405 —— 端点不存在但进程活着）；留空则用实例自己的 path
    http-path: /v1/models
