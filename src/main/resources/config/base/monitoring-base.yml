# ========================================
# 监控基础配置
# ========================================
# 此文件包含监控指标、管理端点等可观测性配置

# 监控指标配置
monitoring:
  # 监控总开关
  enabled: true
  
  metrics:
    enabled: true
    prefix: "jairouter"
    collection-interval: 10s
    enabled-categories:
      - system
      - business
      - infrastructure
      - errors  # 添加错误追踪类别
    custom-tags:
      environment: "production"
      version: "1.0.0"

    # 指标采样配置
    sampling:
      request-metrics: 1.0
      backend-metrics: 1.0
      infrastructure-metrics: 0.1
      trace-metrics: 1.0
      trace-processing-metrics: 1.0
      trace-analysis-metrics: 1.0

    # 性能优化配置
    performance:
      async-processing: true
      batch-size: 100
      buffer-size: 1000

    # 性能阈值配置
    thresholds:
      default-threshold: 1000
      operation-thresholds:
        api_call: 2000
        database_query: 500
      slow-query-threshold: 5000
      slow-query-thresholds:
        chat: 8000
        embedding: 3000
        rerank: 2000
        tts: 8000
        stt: 30000        # 修复：从 stttts 改为 stt
        imgGen: 30000     # 修复：从 imgGentts 改为 imgGen
        imgEdit: 30000    # 修复：从 imgEdittts 改为 imgEdit

# 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,jairouter-metrics,error-tracking
  endpoint:
    health:
      show-details: always
      show-components: always
      # 显式开启活性/就绪探针分组，供 K8s livenessProbe / readinessProbe 使用（#165）。
      # Spring Boot 3 在检测到 Kubernetes 环境时会自动开启，但显式声明可避免依赖
      # 云平台自动探测——非 K8s 环境（本地、纯 Docker）下不声明会导致探针路径 404。
      probes:
        enabled: true
      group:
        # 活性：只看进程是否存活。刻意不纳入 db/redis——下游依赖抖动应由就绪摘流处理，
        # 不应触发 Pod 重启（重启解决不了依赖故障，只会放大抖动）。
        liveness:
          include: livenessState,ping
        # 就绪：只用 readinessState。
        #
        # 刻意不 include db/redis：Spring Boot 对 group 成员做**严格存在性校验**
        # （HealthEndpointGroupMembershipValidator），include 一个当前上下文不存在的
        # 贡献者会导致**应用启动失败**——例如没有 DataSource 的上下文就没有 db 组件
        # （已由 GracefulShutdownInFlightRequestTest 实测复现）。
        # 代价：数据库不可用不会让 Pod 退出就绪集合，请用 /actuator/health 的 db 组件
        # 详情配合告警规则来覆盖这一场景。
        readiness:
          include: readinessState
    prometheus:
      cache:
        time-to-live: 10s
  health:
    # Redis 健康探针默认关闭：未启用 Redis 时，Spring Boot 自动装配的探针会
    # 探测 localhost:6379 并把 /actuator/health 判为 DOWN，导致容器恒 unhealthy
    #（见 issue #46）。确实使用 Redis 的部署请设置 REDIS_ENABLED=true 才纳入健康判定。
    redis:
      enabled: ${REDIS_ENABLED:false}
  metrics:
    export:
      prometheus:
        enabled: true
        descriptions: true
        step: 10s
    tags:
      application: jairouter
      environment: ${spring.profiles.active:default}
    web:
      server:
        request:
          autotime:
            enabled: true