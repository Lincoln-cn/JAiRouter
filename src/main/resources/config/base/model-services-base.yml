# ========================================
# 模型服务基础配置
# ========================================
# 此文件包含模型路由的核心业务配置
# 包括负载均衡、限流、熔断等基础策略

model:
  # 全局配置
  load-balance:
    type: random # 支持: random, round-robin, least-connections, ip-hash
    hash-algorithm: "md5" # IP Hash 策略的哈希算法

  # 全局适配器配置 - 如果服务没有指定适配器，将使用此配置
  adapter: gpustack # 支持: normal, gpustack, ollama, vllm, xinference, localai

  # 全局限流配置
  rate-limit:
    enabled: true
    algorithm: "token-bucket"
    capacity: 1000
    rate: 100
    scope: "service"
    client-ip-enable: false  # v3.5.2(#623): 该维度已接线，默认关闭——集群/无反代下按 IP 计数会合并不同客户端

  # 全局熔断配置
  circuit-breaker:
    enabled: true
    failureThreshold: 5
    timeout: 60000
    successThreshold: 2

  # 全局降级配置
  fallback:
    enabled: true
    strategy: default

  # services 段已迁出（v3.5.3 #643）：model.services 的唯一来源是
  # config/router/services.yml；本文件只保留全局聚合策略（load-balance / adapter / rate-limit /
  # circuit-breaker / fallback），避免两份定义互相覆盖。
