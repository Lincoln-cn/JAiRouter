# ========================================
# 模型服务基础配置
# ========================================
# 此文件包含模型路由的核心业务配置
# 包括负载均衡、限流、熔断等基础策略

model:
  # 全局配置
  load-balance:
    type: random # 支持: random, round-robin, least-connections, ip-hash
    hash-algorithm: "md5" # IP Hash 策略的哈希算法

  # 全局适配器配置 - 如果服务没有指定适配器，将使用此配置
  adapter: gpustack # 支持: normal, gpustack, ollama, vllm, xinference, localai

  # 全局限流配置
  rate-limit:
    enabled: true
    algorithm: "token-bucket"
    capacity: 1000
    rate: 100
    scope: "service"
    client-ip-enable: true  # 启用客户端IP限流

  # 全局熔断配置
  circuit-breaker:
    enabled: true
    failureThreshold: 5
    timeout: 60000
    successThreshold: 2

  # 全局降级配置
  fallback:
    enabled: true
    strategy: default

  services:
    # 聊天服务配置
    chat:
      load-balance:
        type: least-connections
      adapter: gpustack # 使用GPUStack适配器
      # 服务级别限流配置
      rate-limit:
        enabled: true
        algorithm: "token-bucket"
        capacity: 100
        rate: 10
        scope: "service"
        client-ip-enable: true
      instances:
        - name: "qwen3:4b"
          instance-id: "f0461c5b-f894-4b6e-aace-6a133b2a1559"
          base-url: "http://172.16.30.6:9090"
          path: "/v1/chat/completions"
          weight: 1
          # 添加认证配置
          headers:
            Authorization: "Bearer ${GPUSTACK_API_TOKEN:}"
          # 实例级别限流配置
          rate-limit:
            enabled: true
            algorithm: "token-bucket"
            capacity: 50
            rate: 5
            scope: "instance"

    # Embedding 服务配置
    embedding:
      load-balance:
        type: round-robin
      rate-limit:
        enabled: true
        algorithm: "token-bucket"
        capacity: 200
        rate: 20
        scope: "service"
        client-ip-enable: true
      # 为 embeddings 服务添加专门的熔断器配置
      circuit-breaker:
        enabled: true
        failureThreshold: 10  # 提高失败阈值，避免因认证错误导致频繁熔断
        timeout: 30000       # 缩短熔断超时时间
        successThreshold: 3
      instances:
        - name: "nomic-embed-text-v1.5"
          instance-id: "9352737c-7e9a-415c-afbc-a9c533b63388"
          base-url: "http://172.16.30.6:9090"
          path: "/v1/embeddings"
          weight: 1
          headers:
            Authorization: "Bearer ${GPUSTACK_API_TOKEN:}"
        - name: "bge-large-zh-v1.5"
          instance-id: "663ef0dd-a08c-4d93-b5be-86af766f10fb"
          base-url: "http://172.16.30.6:9090/"
          path: "/v1/embeddings"
          weight: 1
          headers:
            Authorization: "Bearer ${GPUSTACK_API_TOKEN:}"
        - name: "bge-large-zh-v1.5"
          instance-id: "2c17cfe6-5544-4371-9534-27846ab68e29"
          base-url: "http://172.16.30.6:9090/"
          path: "/v1/embeddings"
          weight: 1
          headers:
            Authorization: "Bearer ${GPUSTACK_API_TOKEN:}"

    # Rerank 服务配置
    rerank:
      load-balance:
        type: ip-hash
        hash-algorithm: "sha256"
      fallback:
        enabled: true
        strategy: cache
        cache-size: 50
        cache-ttl: 600000 # 10分钟
      rate-limit:
        enabled: true
        algorithm: "token-bucket"
        capacity: 50
        rate: 5
        scope: "service"
        client-ip-enable: true
      instances:
        - name: "bge-reranker-v2-m3"
          instance-id: "e28e74f0-99e8-4de9-b37e-3328f83da0f5"
          base-url: "http://172.16.30.6:9090"
          path: "/v1/rerank"
          weight: 2
          headers:
            Authorization: "Bearer ${GPUSTACK_API_TOKEN:}"

    # TTS 服务配置
    tts:
      load-balance:
        type: random
      rate-limit:
        enabled: true
        algorithm: "token-bucket"
        capacity: 30
        rate: 3
        scope: "service"
        client-ip-enable: true
      instances:
        - name: "cosyvoice-300m"
          instance-id: "3fe04c97-a68a-4926-a9ab-9cb34028da44"
          base-url: "http://172.16.30.6:9090"
          path: "/v1/audio/speech"
          weight: 1
          headers:
            Authorization: "Bearer ${GPUSTACK_API_TOKEN:}"

    # STT 服务配置
    stt:
      load-balance:
        type: round-robin
      rate-limit:
        enabled: true
        algorithm: "token-bucket"
        capacity: 30
        rate: 3
        scope: "service"
        client-ip-enable: true
      instances:
        - name: "faster-whisper-tiny"
          instance-id: "d6cef366-2bc0-4228-8bea-b220665094c8"
          base-url: "http://172.16.30.6:9090"
          path: "/v1/audio/transcriptions"
          weight: 1
          headers:
            Authorization: "Bearer ${GPUSTACK_API_TOKEN:}"

    imgGen:
      load-balance:
        type: round-robin
      rate-limit:
        enabled: true
        algorithm: "token-bucket"
        capacity: 10
        rate: 1
        scope: "service"
        client-ip-enable: true
      instances:
        - name: "stable-diffusion-2-1"
          instance-id: "4b01f194-1c72-4cff-8520-4b10d3bb1329"
          base-url: "http://172.16.30.6:9090"
          path: "/v1/images/generations"
          weight: 1
          headers:
            Authorization: "Bearer ${GPUSTACK_API_TOKEN:}"

    imgEdit:
      load-balance:
        type: round-robin
      rate-limit:
        enabled: true
        algorithm: "token-bucket"
        capacity: 10
        rate: 1
        scope: "service"
        client-ip-enable: true
      instances:
        - name: "stable-diffusion-2-1"
          instance-id: "46de45f9-1702-461b-95cd-5f0e7424f8b8"
          base-url: "http://172.16.30.6:9090"
          path: "/v1/images/edits"
          weight: 1
          headers:
            Authorization: "Bearer ${GPUSTACK_API_TOKEN:}"