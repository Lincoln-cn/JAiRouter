# ========================================
# 生产环境配置（v2.8.x 精简版）
# ========================================
# 此文件仅包含生产环境特定的差异化配置
# 基础配置通过模块化导入，详见 application.yml
# 敏感配置必须使用环境变量！

# 日志配置（生产环境最小化）
logging:
  level:
    root: WARN
    org.unreal.modelrouter: WARN
    org.springframework: ERROR
  file:
    name: logs/jairouter-prod.log

# H2 控制台（生产环境关闭）
spring:
  h2:
    console:
      enabled: false

# 管理端点（生产环境最小开放）
management:
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

# 安全配置（生产环境）
jairouter:
  security:
    # 生产环境安全功能
    enabled: true

    jwt:
      enabled: true
      # 生产环境必须使用环境变量设置密钥（优先读 JWT_SECRET，回退 PROD_JWT_SECRET，两者皆无则报错）
      secret: "${JWT_SECRET:${PROD_JWT_SECRET:}}"
      issuer: "jairouter-prod"

      persistence:
        enabled: false
        redis:
          enabled: false

    api-key:
      enabled: true
      default-expiration-days: 365

    audit:
      log-level: "WARN"
      include-request-body: false
      include-response-body: false
      retention-days: 90

    sanitization:
      response:
        enabled: true
        log-sanitization: false

    monitoring:
      # 安全告警（SecurityAlertService / SecurityAlertScheduler）：阈值语义 = 「窗口内计数」
      # 原比率键（authentication-failure-rate 等）从未有实现，已移除；
      # 原 email / webhook 通知从未有实现，按出口契约（指标 + 日志）移除。
      alerts:
        enabled: true
        window-check-interval-ms: 300000
        thresholds:
          authentication-failure-count: 5
          authentication-failure-window-minutes: 5
          suspicious-ip-count: 10
          suspicious-ip-window-minutes: 10
          sanitization-count: 100
          sanitization-window-minutes: 60
          jwt-failure-count: 20
          jwt-failure-window-minutes: 10
          cooldown-minutes: 15
