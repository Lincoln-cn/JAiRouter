store:
  type: h2

spring:
  # 说明：这里曾有 spring.r2dbc.* 配置，但工程没有 R2DBC 驱动依赖，从未生效（#875 已删除）

  # JDBC 配置 (JPA Repository 测试)
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # Flyway：测试环境显式关掉（issue #192）
  # 应用默认会按数据源方言启用 Flyway（见 FlywayDialectEnvironmentPostProcessor）并把 ddl-auto
  # 覆盖为 validate；但测试用的是内存库 + create-drop，由 Hibernate 建表即可，不需要也不该跑
  # 面向文件库的生产迁移脚本。这里的显式设置优先级高于处理器注入的方言默认值。
  flyway:
    enabled: false

  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.unreal.modelrouter.store: DEBUG
