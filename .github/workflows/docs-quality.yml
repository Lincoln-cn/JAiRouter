name: 文档质量检查

on:
  workflow_dispatch:
  pull_request:
    paths: 
      - 'docs/**'
      - 'mkdocs.yml'
      - '*.md'
      - '.cspell.json'
      # issue #358：本 workflow 会跑 scripts/docs/ 下的检查器（含链接检查与它的自测），
      # 而路径过滤原先不含该目录 ⇒ **改这些脚本不会触发本 workflow**
      # （与 #357 在 docs-version-management.yml 修掉的是同一类缺口）。
      - 'scripts/docs/**'
  push:
    branches: [ main, master ]
    paths: 
      - 'docs/**'
      - 'mkdocs.yml'
      - '*.md'
      - '.cspell.json'
      # issue #358：本 workflow 会跑 scripts/docs/ 下的检查器（含链接检查与它的自测），
      # 而路径过滤原先不含该目录 ⇒ **改这些脚本不会触发本 workflow**
      # （与 #357 在 docs-version-management.yml 修掉的是同一类缺口）。
      - 'scripts/docs/**'

permissions:
  contents: read

jobs:
  quality-check:
    runs-on: ubuntu-latest
    name: 文档质量检查
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: 设置 Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: 安装 MkDocs 依赖
      run: |
        pip install --upgrade pip
        pip install mkdocs-material
        pip install mkdocs-git-revision-date-localized-plugin
        pip install mkdocs-mermaid2-plugin
        pip install mkdocs-static-i18n
        pip install mkdocs-minify-plugin

    - name: 验证 MkDocs 配置
      run: |
        mkdocs build --strict --verbose
        echo "✅ MkDocs 配置验证通过"
    
    - name: 检查 Markdown 语法
      uses: DavidAnson/markdownlint-cli2-action@v20
      with:
        config: '.markdownlint.json'
        globs: |
          **/*.md
          !node_modules/**
    
    - name: 自测围栏配平检查脚本
      run: |
        echo "🧪 运行围栏配平检查自测（配平通过 / 奇数围栏 / 两反引号开栏 / 两反引号闭栏）..."
        python3 scripts/docs/test_check_fence_parity.py

    - name: 检查代码围栏配平
      run: |
        echo "🔍 检查每篇文档的 markdown 围栏是否配平（奇数会让整篇自错位点起被当作代码渲染）..."
        python3 scripts/docs/check-fence-parity.py --dir docs --fail-on-error

    - name: 检查链接有效性 (第三方工具)
      uses: tcort/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        use-verbose-mode: 'yes'
        config-file: '.github/mlc_config.json'
        folder-path: 'docs'
        file-path: './README.md, ./README-ZH.md'
      continue-on-error: true
    
    - name: 自测链接检查脚本
      run: |
        echo "🧪 运行链接检查脚本自测（5xx 重试 / 已登记抖动源降级 / 404 仍判红）..."
        python3 scripts/docs/test_check_links.py

    - name: 检查链接有效性 (自定义脚本)
      run: |
        python3 scripts/docs/check-links.py --dir docs --output link-check-report.json --fail-on-error
        echo "✅ 链接检查完成"

    - name: 自测错误码对账脚本
      run: |
        echo "🧪 运行错误码对账脚本自测（表格码 / 引用块排除 / 注册表解析 / 双向反证）..."
        python3 scripts/docs/test_check_error_codes.py

    - name: 检查文档错误码与注册表双向对账
      run: |
        echo "🔍 对账 docs/**/api-reference/error-codes.md 与 common/constants/ErrorCode.java（双向）..."
        python3 scripts/docs/check-error-codes.py --project-root . --fail-on-error

    - name: 自测 API 端点对账脚本
      run: |
        echo "🧪 运行 API 端点对账脚本自测（映射重建 / 变量归一 / 已移除说明排除 / 反向对照）..."
        python3 scripts/docs/test_check_api_endpoints.py

    - name: 检查文档端点与控制器映射对账
      run: |
        echo "🔍 对账 docs/**/api-reference 的端点路径与 *Controller.java 的映射..."
        python3 scripts/docs/check-api-endpoints.py --project-root . --fail-on-error

    - name: 自测配置清单对账脚本
      run: |
        echo "🧪 运行配置清单对账脚本自测（导入清单 / 框线树解析 / 外部路径排除 / 双向对账）..."
        python3 scripts/docs/test_check_config_imports.py

    - name: 检查文档配置清单与真实配置对账
      run: |
        echo "🔍 对账 modular-config 的导入清单、application-config 的模块清单与真实配置树..."
        python3 scripts/docs/check-config-imports.py --project-root . --fail-on-error
    
    - name: 上传链接检查报告
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: link-check-report
        path: link-check-report.json
    
    - name: 检查文档结构
      run: |
        python3 -c "
        import os
        import sys

        # 检查必需的文档目录是否存在（支持多语言结构）
        # 多语言文档结构：docs/{en,zh}/目录
        required_subdirs = [
            'getting-started',
            'configuration',
            'api-reference',
            'deployment',
            'monitoring',
            'development',
            'troubleshooting',
            'reference'
        ]

        # 检查语言目录
        lang_dirs = ['docs/en', 'docs/zh']
        missing_dirs = []

        for lang_dir in lang_dirs:
            if not os.path.exists(lang_dir):
                print(f'⚠️  语言目录不存在: {lang_dir}')
                continue
            for subdir in required_subdirs:
                full_path = os.path.join(lang_dir, subdir)
                if not os.path.exists(full_path):
                    missing_dirs.append(full_path)

        if missing_dirs:
            print('❌ 缺少必需的文档目录:')
            for dir_path in missing_dirs:
                print(f'  - {dir_path}')
            sys.exit(1)
        else:
            print('✅ 文档目录结构检查通过（多语言结构）')
                "
            
    - name: 检查文档元数据
      run: |
        python3 -c "
        import os
        import re
        
        def check_frontmatter(file_path):
            with open(file_path, 'r', encoding='utf-8') as f:
                content = f.read()
            
            # 检查是否有 frontmatter
            if content.startswith('---'):
                end_pos = content.find('---', 3)
                if end_pos > 0:
                    return True
            return False
        
        # 检查主要文档文件的元数据
        docs_files = []
        for root, dirs, files in os.walk('docs'):
            for file in files:
                if file.endswith('.md'):
                    docs_files.append(os.path.join(root, file))
        
        if docs_files:
            print(f'📋 检查了 {len(docs_files)} 个文档文件')
            print('✅ 文档元数据检查完成')
        else:
            print('⚠️  未找到文档文件')
                "
  spell-check:
    runs-on: ubuntu-latest
    name: 拼写检查
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 拼写检查
      uses: streetsidesoftware/cspell-action@v5
      with:
        files: |
          docs/**/*.md
          *.md
        config: '.cspell.json'
        incremental_files_only: false
