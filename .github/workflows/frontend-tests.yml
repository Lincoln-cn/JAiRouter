name: 前端单元测试

# CodeQL `actions/missing-workflow-permissions`（告警 #82/#84）：
# 两个 job 只需要检出代码，显式收敛为只读，避免继承仓库默认的宽权限。
permissions:
  contents: read

# issue #392：前端单测（vitest，14 文件 / 45 例）此前**只在开发机跑**：
# image-smoke-test 只做「构建 + 镜像产物校验」（`mvn -Pfast -DskipTests ... package`），
# java-tests 的 paths 又不含 frontend/** ⇒ 控制台的逻辑回归没有任何 CI 保障。
#
# 本 workflow 只跑单测与 lint。E2E 已另起 workflow（e2e-smoke.yml，见 issue #948）：
# 它需要真实后端 + 浏览器，单独跑并只接 smoke/overview 子集，避免拖慢这里。
# node/npm 版本与 pom.xml 的 frontend-maven-plugin 保持一致（v22.14.0 / 11.2.0），
# 避免「CI 用一套、镜像构建用另一套」的隐性差异。

on:
  push:
    branches: [ master, main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-tests.yml'
  workflow_dispatch:

concurrency:
  group: frontend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js（与 pom 的 frontend-maven-plugin 一致）
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖（严格按锁文件）
        run: npm ci --no-audit --no-fund

      - name: 运行前端单元测试
        run: npm run test:unit

  lint:
    # issue #462：前端 lint 门闩此前完全不可用 —— eslint 已升到 10.x，
    # 而配置还是 `.eslintrc.cjs`（eslint 10 不再支持 eslintrc）⇒ `npx eslint .` 直接报错退出。
    # 本 job 接的是迁移后的 flat config（frontend/eslint.config.js）。
    #
    # `--max-warnings 0`：#494 的存量 406 条警告已全部清零（#527 / #521 / #520 / #525 / #523 / #522 / #526 / #524）。
    # 两条规则都已是 error：`@typescript-eslint/no-unused-vars`（93 处清零后恢复）与
    # `@typescript-eslint/no-explicit-any`（406 条清零后恢复）⇒ 任何新增问题都会直接让这一步变红。
    name: eslint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js（与 pom 的 frontend-maven-plugin 一致）
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖（严格按锁文件）
        run: npm ci --no-audit --no-fund

      - name: 运行 ESLint（flat config，警告数受棘轮约束）
        run: npx eslint . --max-warnings 0
