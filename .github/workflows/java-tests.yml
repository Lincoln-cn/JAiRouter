name: Java 测试

on:
  workflow_dispatch:
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/main/java/**'
      - 'src/test/java/**'
      - 'src/main/resources/**'
      - 'pom.xml'
      - '.github/workflows/java-tests.yml'
  push:
    branches: [ main, master ]
    paths:
      - 'src/main/java/**'
      - 'src/test/java/**'
      - 'src/main/resources/**'
      - 'pom.xml'
      - '.github/workflows/java-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # PostgreSQL 服务：验证 #160 的跨库适配（H2 的 MODE=PostgreSQL 验不出真实差异）
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      REDIS_TEST: "true"
      REDIS_TEST_HOST: localhost
      REDIS_TEST_PORT: "6379"
      PG_TEST: "true"
      PG_TEST_URL: jdbc:postgresql://localhost:5432/postgres
      PG_TEST_USERNAME: postgres
      PG_TEST_PASSWORD: postgres
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 运行单元与集成测试
        run: mvn -B test

      - name: 校验门控测试未被跳过
        if: always()
        run: |
          set -e
          REPORT=target/surefire-reports
          check_gated() {
            name="$1"
            flag="$2"
            f=$(ls $REPORT/*"$name"*.txt 2>/dev/null | head -n1 || true)
            if [ -z "$f" ]; then
              echo "::error::surefire report for $name not found — test did not run"
              exit 1
            fi
            echo "--- $f ---"
            cat "$f"
            if grep -qE 'Tests run:.*Skipped: [1-9]' "$f"; then
              echo "::error::gated test $name was SKIPPED despite $flag=true"
              exit 1
            fi
            echo "gated test $name executed (not skipped)"
          }
          check_gated QuotaDistributedRedisIntegrationTest REDIS_TEST
          check_gated PostgresCompatibilityIntegrationTest PG_TEST

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore
