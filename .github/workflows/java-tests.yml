name: Java 测试

on:
  workflow_dispatch:
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/main/java/**'
      - 'src/test/java/**'
      - 'src/main/resources/**'
      - 'pom.xml'
      - '.github/workflows/java-tests.yml'
  push:
    branches: [ main, master ]
    paths:
      - 'src/main/java/**'
      - 'src/test/java/**'
      - 'src/main/resources/**'
      - 'pom.xml'
      - '.github/workflows/java-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_TEST: "true"
      REDIS_TEST_HOST: localhost
      REDIS_TEST_PORT: "6379"
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 运行单元与集成测试
        run: mvn -B test

      - name: 校验门控测试未被跳过
        if: always()
        run: |
          set -e
          REPORT=target/surefire-reports
          f=$(ls $REPORT/*QuotaDistributedRedisIntegrationTest*.txt 2>/dev/null | head -n1 || true)
          if [ -z "$f" ]; then
            echo "::error::surefire report for QuotaDistributedRedisIntegrationTest not found — test did not run"
            exit 1
          fi
          echo "--- $f ---"
          cat "$f"
          if grep -qE 'Tests run:.*Skipped: [1-9]' "$f"; then
            echo "::error::gated Redis test was SKIPPED despite REDIS_TEST=true"
            exit 1
          fi
          echo "gated Redis test executed (not skipped)"

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore
